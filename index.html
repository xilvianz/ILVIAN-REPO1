<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILVIAN | Dignified Comfort</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #fff;
      color: #333;
    }

    a { text-decoration: none; color: inherit; }

    /* Floating Top Icons */
    .top-icons {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 1rem;
      z-index: 1000;
    }

    .top-icons svg {
      width: 24px;
      height: 24px;
      fill: #333;
      cursor: pointer;
    }

    /* Logo floating top left */
    .logo {
      position: fixed;
      top: 10px;
      left: 10px;
      font-weight: bold;
      font-size: 1.5rem;
      letter-spacing: 2px;
      z-index: 1000;
    }

    /* Category Title */
    .category-title {
      font-weight: bold;
      font-size: 1.2rem;
      margin: 70px 0 10px 10px;
    }

    /* Product Carousel */
    .product-row {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
      gap: 10px;
      padding: 10px;
    }

    .product-card {
      flex: 0 0 auto;
      width: 160px;
    }

    .product-card img {
      width: 100%;
      border-radius: 5px;
    }

    .product-card p {
      text-align: center;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    .product-card span {
      display: block;
      text-align: center;
      font-size: 0.85rem;
      color: #555;
    }

    /* Hide scrollbar */
    .product-row::-webkit-scrollbar { display: none; }
    .product-row { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body>

  <!-- Floating Logo -->
  <div class="logo">ILVIAN</div>

  <!-- Floating Icons -->
  <div class="top-icons">
    <!-- Search Icon -->
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM10 14a4 4 0 110-8 4 4 0 010 8z"/></svg>
    <!-- Account Icon -->
    <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.2c-3.1 0-9.3 1.6-9.3 4.9v2.7h18.6v-2.7c0-3.3-6.2-4.9-9.3-4.9z"/></svg>
    <!-- Cart Icon -->
    <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2s.89 2 2 2 2-.9 2-2-.9-2-2-2zM7.16 14l-.94-2h11.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49-1.68-1L17.44 9H7.21L6.27 6H1v2h3l3.6 7.59-1.35 2.44C5.08 18.37 5 18.68 5 19c0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25L7.16 14z"/></svg>
    <!-- Menu Icon -->
    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
  </div>

  <!-- MEN Category -->
  <div class="category-title">MEN</div>
  <div class="product-row" id="men-row">
    <div class="product-card">
      <img src="images/men1.jpg" alt="Men Product 1">
      <p>Formal Shirt</p>
      <span>৳1290</span>
    </div>
    <div class="product-card">
      <img src="images/men2.jpg" alt="Men Product 2">
      <p>T-shirt</p>
      <span>৳790</span>
    </div>
    <!-- Repeat up to men8.jpg -->
  </div>

  <!-- WOMEN Category -->
  <div class="category-title">WOMEN</div>
  <div class="product-row" id="women-row">
    <div class="product-card">
      <img src="images/women1.jpg" alt="Women Product 1">
      <p>Summer Dress</p>
      <span>৳1690</span>
    </div>
    <div class="product-card">
      <img src="images/women2.jpg" alt="Women Product 2">
      <p>Top</p>
      <span>৳990</span>
    </div>
    <!-- Repeat up to women8.jpg -->
  </div>

  <!-- KIDS Category -->
  <div class="category-title">KIDS</div>
  <div class="product-row" id="kids-row">
    <div class="product-card">
      <img src="images/kids1.jpg" alt="Kids Product 1">
      <p>T-shirt</p>
      <span>৳590</span>
    </div>
    <div class="product-card">
      <img src="images/kids2.jpg" alt="Kids Product 2">
      <p>Shorts</p>
      <span>৳490</span>
    </div>
    <!-- Repeat up to kids8.jpg -->
  </div>

  <!-- FRAGRANCE Category -->
  <div class="category-title">FRAGRANCE</div>
  <div class="product-row" id="fragrance-row">
    <div class="product-card">
      <img src="images/fragrance1.jpg" alt="Fragrance Product 1">
      <p>Perfume A</p>
      <span>৳890</span>
    </div>
    <div class="product-card">
      <img src="images/fragrance2.jpg" alt="Fragrance Product 2">
      <p>Perfume B</p>
      <span>৳990</span>
    </div>
    <!-- Repeat up to fragrance8.jpg -->
  </div>

  <!-- Link external JS -->
  <script src="script.js"></script>

</body>
        </html>
