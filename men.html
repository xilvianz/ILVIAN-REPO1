<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ILVIAN - Men’s Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #fff;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .product {
      text-align: center;
    }

    .product img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .product-name {
      margin: 10px 0 5px;
      font-weight: bold;
    }

    .product-price {
      color: #555;
      font-size: 14px;
    }

    .product a {
      text-decoration: none;
      color: inherit;
    }

    .product a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>Men’s Collection</h1>

  <div class="products">
    <!-- Product 1 -->
    <div class="product">
      <a href="product1.html">
        <img src="images/men1.jpg" alt="Formal Shirt">
        <div class="product-name">Formal Shirt</div>
        <div class="product-price">৳1,290</div>
      </a>
    </div>

    <!-- Product 2 -->
    <div class="product">
      <a href="product2.html">
        <img src="images/men2.jpg" alt="Casual Shirt">
        <div class="product-name">Casual Shirt</div>
        <div class="product-price">৳990</div>
      </a>
    </div>

    <!-- Product 3 -->
    <div class="product">
      <a href="product3.html">
        <img src="images/men3.jpg" alt="Black Pant">
        <div class="product-name">Black Pant</div>
        <div class="product-price">৳1,590</div>
      </a>
    </div>

    <!-- Product 4 -->
    <div class="product">
      <a href="product4.html">
        <img src="images/men4.jpg" alt="White T-shirt">
        <div class="product-name">White T-shirt</div>
        <div class="product-price">৳690</div>
      </a>
    </div>

    <!-- Product 5 -->
    <div class="product">
      <a href="product5.html">
        <img src="images/men5.jpg" alt="Hoodie">
        <div class="product-name">Hoodie</div>
        <div class="product-price">৳1,890</div>
      </a>
    </div>

    <!-- Product 6 -->
    <div class="product">
      <a href="product6.html">
        <img src="images/men6.jpg" alt="Jacket">
        <div class="product-name">Jacket</div>
        <div class="product-price">৳2,490</div>
      </a>
    </div>

    <!-- Product 7 -->
    <div class="product">
      <a href="product7.html">
        <img src="images/men7.jpg" alt="Sweater">
        <div class="product-name">Sweater</div>
        <div class="product-price">৳1,390</div>
      </a>
    </div>

    <!-- Product 8 -->
    <div class="product">
      <a href="product8.html">
        <img src="images/men8.jpg" alt="Shorts">
        <div class="product-name">Shorts</div>
        <div class="product-price">৳790</div>
      </a>
    </div>
  </div>

</body>
  </html>
