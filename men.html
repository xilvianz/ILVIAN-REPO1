<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ILVIAN - Men’s Collection</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff;
      color: #1F4045;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid #eee;
      background-color: #fff;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-weight: bold;
      font-size: 1.5rem;
    }

    .nav-links a {
      margin-left: 1.5rem;
      text-decoration: none;
      color: #1F4045;
      font-weight: 500;
    }

    h1 {
      text-align: center;
      margin: 2rem 0 1rem;
      font-size: 28px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 0 2rem 3rem;
    }

    .product {
      text-align: center;
    }

    .product img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .product-name {
      margin: 10px 0 5px;
      font-weight: bold;
    }

    .product-price {
      color: #666;
      font-size: 14px;
    }

    .product a {
      text-decoration: none;
      color: inherit;
    }

    .product a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header>
    <div class="logo">ILVIAN</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="cart.html">Cart</a>
    </div>
  </header>

  <h1>Men’s Collection</h1>

  <div class="products">
    <!-- Just update the image paths below to assets/products/men/ -->
    <div class="product">
      <a href="product1.html">
        <img src="assets/products/men/men1.jpg" alt="Formal Shirt">
        <div class="product-name">Formal Shirt</div>
        <div class="product-price">৳1,290</div>
      </a>
    </div>

    <div class="product">
      <a href="product2.html">
        <img src="assets/products/men/men2.jpg" alt="Casual Shirt">
        <div class="product-name">Casual Shirt</div>
        <div class="product-price">৳990</div>
      </a>
    </div>

    <!-- Add more like above -->
  </div>

</body>
</html>
