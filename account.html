<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Account - ILVEAN</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: sans-serif;
      text-align: center;
      padding: 50px 20px;
    }
    .account-box {
      background: #222;
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      margin: 0 auto;
    }
    .logout-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #d00;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="account-box">
    <h2>My Account</h2>
    <p id="userEmail">Checking login...</p>
    <button class="logout-btn" id="logoutBtn">Logout</button>
  </div>

  <!-- Firebase auth script will be added next -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDk2JlbxeNl8xBATl6D2USiOYYFz1gD1gc",
      authDomain: "ilvian-wear.firebaseapp.com",
      projectId: "ilvian-wear",
      storageBucket: "ilvian-wear.appspot.com",
      messagingSenderId: "625535641364",
      appId: "1:625535641364:web:95945b70f70d11b2f84401"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const userEmail = document.getElementById('userEmail');
    const logoutBtn = document.getElementById('logoutBtn');

    // Show user email or redirect
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userEmail.innerText = "Logged in as: " + user.email;
      } else {
        userEmail.innerText = "Not logged in. Redirecting...";
        setTimeout(() => {
          window.location.href = "index.html";
        }, 2000);
      }
    });

    // Logout
    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => {
        alert("Logged out!");
        window.location.href = "index.html";
      }).catch((error) => {
        alert("Error logging out: " + error.message);
      });
    });
  </script>
</body>
</html>
